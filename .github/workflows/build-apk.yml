name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # The runner image already ships the Android SDK; just accept licenses so AGP can fetch missing platforms.
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build release APK
        run: gradle :app:assembleRelease --stacktrace

      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/*.apk out/Linkly.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Linkly-apk
          path: out/Linkly.apk

      # Publish the APK as a release so it can be downloaded directly from a phone or TV browser.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" out/Linkly.apk \
            --title "Linkly (build ${{ github.run_number }})" \
            --notes "APK جاهز للتثبيت المباشر. بُني من ${GITHUB_SHA::7}." \
            --latest
